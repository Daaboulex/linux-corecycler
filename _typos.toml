[default.extend-words]
# "uncorrect" appears as a substring match in MCE error detection
# (checking that "corrected" is not part of "uncorrectable")
uncorrect = "uncorrect"
# UE/CE are the MCA status severity flags (Uncorrected/Corrected Error) the
# kernel prints inside MCx_STATUS[...] blocks and the detector parses.
ue = "ue"

[default.extend-identifiers]
UE = "UE"
