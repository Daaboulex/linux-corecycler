proof = "built"

[[requirement]]
id = "O19.stretch"
statement = "A core's clock stretch is its effective clock below the clock it runs at, read from the PM table's per-core arrays on table 0x620205 only and only with the core at 95 % C0 or more; the Monitor, the core grid and the Results peak show it per core, each stress-run sample records the tested core's PM clock, effective clock, C0 and voltage, and History prints the peak and median stretch from them (scratch/design/clock-stretch.md, step 4)."
proof = "built"

[[requirement]]
id = "HANG.path"
statement = "The heartbeat the driver writes and the watch reads is /run/user/<uid>/corecycler/heartbeat.json for the invoking user, the sudo user under sudo, in a tmpfs no boot outlives, whatever HOME and XDG_RUNTIME_DIR say; the directory a root run makes for it is handed back to that user (scratch/design/hang-reset.md change 2)."
proof = "built"

[[requirement]]
id = "HANG.heartbeat"
statement = "While a supervised test runs, its heartbeat says running with the stage, load and CPUs, the directory the watch probes (probe_dir), the driver's pid and process start time and CLOCK_MONOTONIC, written atomically into a directory made when missing, at once when what it says changes and otherwise every 5 s and never sooner; whatever ends the run, a pass, a failure or an exception, it says between once its run directories are removed while the driver drives (HANG.between) and idle otherwise, so a removal that blocks leaves its running beat to go stale; the idle watch (SOAK) beats the same way as soak watch and ends the same way; the driver hands one heartbeat of its invoking user to every supervised test and idle watch and beats it itself between tests (HANG.between) (scratch/design/hang-reset.md change 2, scratch/design/brief-disk-alive.md change 1)."
proof = "built"

[[requirement]]
id = "HANG.write"
statement = "A heartbeat that cannot be written never ends the test, is logged once each time writing starts to fail, and leaves no earlier running heartbeat behind (scratch/design/hang-reset.md change 2)."
proof = "built"

[[requirement]]
id = "HANG.between"
statement = "The driver beats one heartbeat for its whole run: between, naming as probe_dir the absolute directory of its history database, from --db or the default, whatever HOME says, at every step of its loop while no test runs (the cool-down and the wait between cores, each up to 300 s) and at once when a test reports or is stopped, whatever the test last said, so the verdict's commit, the CO writes and the kernel-log read before a test are watched, renewed every 5 s and never sooner; a test still running keeps its own beat through the loop and the rest; while the loop drives, a test that ends says between itself, and while its thread still lives the loop does not renew that beat, so a test thread that ends one test and blocks before it reports (the next all-core segment's launch on a stalled disk) leaves a between beat the watch finds stale; once the session rests (paused, completed, aborted, quarantined or closed) or the loop ends on an error, it says idle unless a test still says running, whose end then says idle (scratch/design/brief-disk-alive.md change 1 and review round 1)."
proof = "built"

[[requirement]]
id = "HANG.disk"
statement = "While a session drives (HANG.watch) and its beat names an absolute probe_dir, each check of the watch starts, unless one is still in flight, a write on a daemon thread of the file hang-watch-probe in that directory, written, fsynced and removed, never through a link, and never waits on it; when no write has ended for more than --stale-after seconds since the session began driving, two checks at least --every apart reset, naming the silent disk and the directory and the age of its last answer since the session began driving or, with none, of that beginning; a write that fails with an error is an answer, said once per change, and never resets by itself; no write is made and nothing resets while the beat is idle, missing or malformed or its pid is gone, reused, a zombie or stopped; a session that drives again gives the disk its whole limit again (scratch/design/brief-disk-alive.md change 3)."
proof = "built"

[[requirement]]
id = "HANG.log"
statement = "Every line the watch says, the reset's included, goes in order to the log on a daemon thread of its own, so a log that blocks holds neither a check nor the reset; a line that finds 64 lines unwritten, the one being written included, is dropped and counted, and the count is said ahead of the next line the log has room for; a line the log fails to write with an error ends its thread and any wait for it and keeps the error, later lines raising nothing; the watch raises it, for systemd to start it again, only at the end of a check that suspects no hang and probes no disk, so a silent disk or a stale beat still resets within one watch (HANG.watch); the reset waits for its own line at most until it writes b, and a log that failed still gets b 2 s after s, and between checks the log gets the time the watch would wait anyway and no more, so the next check still comes one period after the last (scratch/design/brief-disk-alive.md change 4)."
proof = "built"

[[requirement]]
id = "HANG.watch"
statement = "corecycler hang-watch, run as the driver's user, reads that user's heartbeat every --every seconds (15); a session drives while its beat says running or between and its pid lives with the start time the beat names, read as bytes after the last parenthesis of /proc/<pid>/stat, and is not stopped; it resets only when two checks at least --every apart both find the same beat of a driving session more than --stale-after seconds (120) behind CLOCK_MONOTONIC, or its disk silent that long (HANG.disk); a beat stale on one check and idle, fresh, of another time or stopped on the next never resets; a fresh, idle, missing, unreadable or malformed heartbeat, one without a start time, one naming a directory to probe that is not an absolute path, a gone, reused, zombie or stopped pid and exactly the limit never reset, each reason is said once per change, a trigger the user may not write is said each time it becomes so, nothing resets while it stays so and a proven hang is said to be left unreset, and a limit or period that is not a positive number of seconds is refused; with hangReset and deviceAccess on, the corecycler group gets the trigger and a user unit of the deviceAccessUser, who lingers, runs it from boot, restarted 15 s after a crash, with the trigger granted before any user manager starts, and with either off neither exists (flake check module-hang-reset) (scratch/design/hang-reset.md change 2)."
proof = "built"

[[requirement]]
id = "HANG.reset"
statement = "A proven hang writes s to /proc/sysrq-trigger, then says the test or the session between tests, or the silent disk and its directory, the pid and the age of the last beat, of the disk's last answer or of when the session began driving, at critical priority, which journald syncs at once, abandoning a log that blocks or failed (HANG.log), then writes b exactly 2 s after s, never sooner and never later however long the line took (scratch/design/hang-reset.md change 2, scratch/design/brief-disk-alive.md change 2)."
proof = "built"

[[requirement]]
id = "PROGRAM_FAULT.parse"
statement = "The kernel reader reads a user program's fault line, comm[pid]: segfault at, or traps: comm[pid] trap or general protection fault, into its process, pid and the CPU and core the kernel names in likely on CPU N (core C, socket S), or no CPU named when the line names none; the 17:11:57 wireplumber line reads as CPU 23, core 7; a fault line inside a machine-check record leaves the record open (scratch/design/segfault-evidence.md)."
proof = "built"

[[requirement]]
id = "PROGRAM_FAULT.verdict"
statement = "A program fault is never a verdict, whatever CPU it names or none, in a 1T, all-core or MEMORY test, in its settle read and in an idle watch: it is seen and kept as evidence, the payload's own crash staying the backend's one failure, until recorded data shows such lines predict a failure (scratch/design/segfault-evidence.md)."
proof = "built"

[[requirement]]
id = "PROGRAM_FAULT.evidence"
statement = "Every program fault a test saw, in any segment or the soak, is stored in the test's evidence as read (process, pid, CPU and core or none, the kernel's line and its kernel-log time) with the test's start in CLOCK_MONOTONIC ns, the latest kept and the earlier ones counted as dropped; the driver's log shows each as about N s into the test, the kernel log's clock against that start (scratch/design/segfault-evidence.md)."
proof = "built"

[[requirement]]
id = "PROGRAM_FAULT.outside"
statement = "Program faults are recorded into the session's events from the journal a resume reads after the last test's read, the dead boot's after a crash or this boot's on a resume in the same boot, each naming its process, CPU and core or no CPU named and its time into its boot, on the session that carries on after a supersede, each once per session, the latest of a resume kept and the earlier ones counted; between tests in a live session they are not read (scratch/design/segfault-evidence.md)."
proof = "built"

[[requirement]]
id = "PROGRAM_FAULT.explorer"
statement = "In the fake world the machine's transition never reads the program faults a test's report carries, and every future with such reports reaches a rest (scratch/design/segfault-evidence.md)."
proof = "built"

[[requirement]]
id = "HEAVY.path"
statement = "The shared heavy-test lock is /run/user/<uid>/heavy-test.lock for the invoking user, the sudo user under sudo, whatever HOME and XDG_RUNTIME_DIR say (scratch/design/brief-shared-lock.md)."
proof = "built"

[[requirement]]
id = "HEAVY.sudo"
statement = "Under sudo the lock file a root run created is handed to SUDO_UID and SUDO_GID without following a link, so the user's own later runs can still open it (scratch/design/brief-shared-lock.md)."
proof = "built"

[[requirement]]
id = "HEAVY.take"
statement = "Taking the shared lock opens it, made mode 0600 when missing, takes flock LOCK_EX with LOCK_NB, replaces what the file held with one line, the tool, its pid and the local time in ISO 8601 with its offset, and holds it until its file closes or the process ends however it ends, no program it started keeping it; another tool holding it refuses naming the holder's first line, an empty line or one that is not text named as such (scratch/design/brief-shared-lock.md)."
proof = "built"

[[requirement]]
id = "HEAVY.fail_closed"
statement = "A runtime directory that is missing or the user cannot write, a link at the lock's path, a failed flock or a line that cannot be written refuses naming the path and the error, creates nothing outside the runtime directory, leaves a link's target alone and leaves the lock free (scratch/design/brief-shared-lock.md)."
proof = "built"

[[requirement]]
id = "HEAVY.driver"
statement = "The tuner driver takes the shared lock as corecycler-tuner for start, resume, validate, continue and restart, the boot resume included, before it builds the SMU or opens the database, and lets it go when it comes to rest, paused, closed or stopped by an error; while another tool holds it the driver exits refused naming the holder's line, the code the boot resume unit retries, and writes nothing; abort runs no test and goes ahead (scratch/design/brief-shared-lock.md)."
proof = "built"

[[requirement]]
id = "HEAVY.gui"
statement = "Start Test and the Memory tab's stress test each take the shared lock as corecycler-gui before their run begins and their worker lets it go when the run ends, however it ends: finished, stopped or crashed; while another tool holds it either refuses naming the holder's line and starts nothing (scratch/design/brief-shared-lock.md)."
proof = "built"
