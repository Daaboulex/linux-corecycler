[[requirement]]
id = "D57"
statement = "In every all-core stage a FAIL naming cores backs each named owned core below 0 off 1 in place with FB, dirty, tClean 0, the same load again, no Bisect; in TIGHTEN a FAIL naming the item's own core freezes it; a named core at 0 leaves the FAIL to the stage rule; a named core not owned is P(HELD_KNOB)"
proof = "built"

[[requirement]]
id = "D58"
statement = "A HOT, BURST or IDLE segment, whose hold freezes at the thermal limit, counts run time while held on heat: the time held lengthens it, and held more than 300 s in all, across every hold, it ends as THERMAL with its cool-down; frozen time past the deadline does not count toward the work floor; the WARM slice's hold sits in its wall time instead (D119) (PLAN Next 79, review round 1; Next 87)"
proof = "built"

[[requirement]]
id = "D119"
statement = "A WARM slice lasts its asked wall seconds with its hold cycling inside them: its heat holds neither lengthen it nor count toward the cap as a sum, and a heat hold still on at its end is followed to its release, so one unbroken hold past 300 s, the CPU never cooling to the release point, ends it with no verdict (APPARATUS, held_too_long), retried at once and pausing after the apparatus retries, even in a slice shorter than the cap (PLAN Next 87, the test machine under balanced: the all-core warm load heats 55 to 65 C in one to two seconds and cools in about ten, so the summed cap ended every warm test at stock)"
proof = "built"

[[requirement]]
id = "D119.ran"
statement = "Every all-core verdict, its detail line in the session log and in the stored test row, says how many of its wall seconds the load ran and their share, so a warm test whose hold let the load run little is visible; the coverage record keeps the running seconds per core and cell beside it (PLAN Next 87)"
proof = "built"

[[requirement]]
id = "D120"
statement = "A WARM slice passes only when its load ran at least 5 percent of its wall time, exactly 5 percent included; under it the slice is no verdict (APPARATUS, held_too_long), its words giving the seconds the load ran, the 5 percent floor, the release point and the last reading; a HOT, BURST or IDLE segment, which makes up its held time, has no such floor, so IDLE's long planned rests still pass (D120, the Next 87 review: a 3 s warm test passed with the load running 2 percent)"
proof = "built"

[[requirement]]
id = "D120.unread"
statement = "An unread Tctl freezes the WARM load as missing input, its time counted as unread whether the warm hold is on or released (D121); while released it never lengthens the slice, so an unread spell still on at the slice's end is not waited for and the time unread counts toward no cap; while the hold is on, the hold goes on as heat through the unread reading under its 300 s unbroken cap; either way the hold keeps its state for the next reading (D120 as amended, D121, the Next 87 reviews: Tctl unread for 50 ticks then one cool read passed, and one unread reading inside a stuck hold ended the wait)"
proof = "built"

[[requirement]]
id = "D121"
statement = "A WARM slice whose Tctl went unread, its hold on or released, for more than half its wall time is no verdict (APPARATUS, held_too_long) whatever share the load ran, its words giving the seconds unread, the 50 percent limit, the release point and the last reading; exactly half passes; a HOT, BURST or IDLE segment has no such limit (D121, the Next 87 review round 2: Tctl unread 11 of every 12 readings passed at 7 percent load; a healthy sensor read unread in none of 525,494 samples on the test machine)"
proof = "built"

[[requirement]]
id = "D120.killed"
statement = "A payload killed while frozen counts its open freeze, up to when it was found dead, in the frozen seconds its result reports, so the seconds the load ran are never overstated (D120, the Next 87 review)"
proof = "built"

[[requirement]]
id = "D122"
statement = "A contained payload's memory.events is read only once its scope provably holds the adopted payload: on a watchdog tick after the scope adopted it, never on a tick before, and at the stop once the scope is learned and before SIGTERM; a run that faulted before its scope was learned still learns it at the stop, so its OOM kills are read; a read that fails then is no verdict (UNVERIFIED) with no second read, and so is a payload never seen in its scope and a scope removed after its payload ended, never zero OOM kills (D122, a fault-investigator's report: ryzen h17 test 56 and h18 test 251 went unverified because the first tick read the scope before systemd created it; the Next 90 review round 1: a scheduling fault or a kernel event before adoption dropped an OOM kill from the verdict)"
proof = "built"

[[requirement]]
id = "D122.kill"
statement = "A scope kill whose cgroup.kill write fails with ENODEV, as it does while systemd removes the emptied scope, is done only when cgroup.procs then fails or reads empty; with cgroup.procs listing a process, or on any failure but a scope already gone, the test is no verdict (CONTAINMENT_BROKE, apparatus) naming the scope and the error, since a leftover process could load the next test (D122, a fault-investigator's report: h18 test 391 logged ENODEV as an ERROR and passed)"
proof = "built"

[[requirement]]
id = "D123"
statement = "A y-cruncher hang is caught in BURST: its hang window counts planned rests, since y-cruncher's own per-test clock keeps running through them, and never heat or unread holds, so on test 409's freeze timeline a hang 16 s or 32 s into its burst segment ends STALL while the same run healthy passes (D123, the Next 91 review: both hangs ended PASS when only thawed time counted)"
proof = "built"

[[requirement]]
id = "D123.window"
statement = "The y-cruncher window is two of its tests plus the longest planned rest of its own plan: BURST 30 s plus at most 4 s, the one-core record 41 s, HOT and WARM two tests outside their holds; a plan whose longest rest lasts a whole test has no window: IDLE (rests 15 to 40 s against 10 s tests), which D124 judges instead from 360 stage seconds (D123; the 2026-10-09 field idles replayed with y-cruncher's clock in wall time put a healthy idle's gap between finished tests at 76 to 114 s, past the 60 s its plan would give)"
proof = "built"

[[requirement]]
id = "D124"
statement = "A full 60 s WARM slice whose y-cruncher finished no test by the slice's end, its hold followed to its release, is a STALL (APPARATUS), judged per slice; a last slice shorter than 60 s, which may end before its 30 s test can finish, is not judged; since its holds leave the D123 window short of run time: a spin-hang from the slice's start ends STALL while a healthy slice that finishes its one test late in the slice passes; a slice cut short, held too long or with no work done keeps that verdict (D124, the Next 93 builder's replay: a spin-hang reached 8.5 to 9.1 s of its 60 s window and passed; the test machine's 4 healthy warm passes finished a test in every slice)"
proof = "built"

[[requirement]]
id = "D124.idle"
statement = "An IDLE test of 360 stage seconds or more, the default, whose y-cruncher finished no test in its whole run is a STALL (APPARATUS), judged once per test over its one segment and whatever cores it drew, one, two or four; one that finished a test passes, its rests as long as they come; a shorter IDLE is not judged, as before, since every plan seed gives a 360 s idle at least 2.08 s of run time and a shorter one less; the field has not yet measured a one-core draw (D124 as amended by the main session; the test machine's 3 healthy idle passes on 32 CPUs finished 2, 3 and 13 tests, their draws unrecorded)"
proof = "built"

[[requirement]]
id = "HOLD.planned"
statement = "A planned freeze, BURST's gaps and IDLE's rests, neither counts toward the hold cap nor extends the deadline, so a default 360 s IDLE test, which rests about 355 s, runs its asked seconds; it still excuses the stall watch and the work floor (PLAN Next 79, the main session's decision of 2026-10-27, after h14 test 528 passed IDLE at 120 s stage seconds)"
proof = "built"

[[requirement]]
id = "HOLD.words"
statement = "A hold past its cap says so in the hold's own words, the cap, how it counted (in all for a summed cap, in one hold for the warm heat hold), the release point, the reading the hold judges and its last value; the warm hold's pause after the apparatus retries repeats them and names no limit, which the warm hold never reaches (PLAN Next 79; Next 87)"
proof = "built"

[[requirement]]
id = "WARM.rest"
statement = "A WARM test reads Tctl once before its load and releases its hold at the higher of 55 C and the Tctl read before its load plus 2 C, never above the thermal limit less 20 C, holding at 10 C above the release, so its hold edge never passes the hot hold's release; a reading at or below 53 C keeps 55 to 65 C; the reading follows the last run's machine-check settle, not a cool-down, so the heat BURST leaves raises the band no further than that ceiling, and a reading of 84 C at a 95 C limit holds at 85 C and releases below 75 C (PLAN Next 79, the test machine at Tctl 56 C, Tccd2 60 C under balanced; the ceiling from review round 1)"
proof = "built"

[[requirement]]
id = "WARM.tctl.unread"
statement = "A Tctl that cannot be read during a WARM test holds the load (D120.unread), so a Tctl that stays unread ends the slice at its asked seconds with no verdict, never a pass, being unread more than half of it (D121), its words saying last read unread (PLAN Next 79, review round 1; Next 87, D120, D121)"
proof = "built"

[[requirement]]
id = "WARM.tctl"
statement = "The warm hold judges Tctl, the package's own reading: at rest on the test machine its CCDs read 42 and 60 C beside Tctl 56 C, and the hottest input, one CCD's own sensor there, read 60, 56.0 and 55.1 C within minutes; the hot hold of HOT, BURST and IDLE and the thermal stop judge the hottest input (PLAN Next 79)"
proof = "built"

[[requirement]]
id = "WARM.rest.unread"
statement = "A WARM test whose Tctl cannot be read before its load runs nothing and gives no verdict (PLAN Next 79)"
proof = "built"

