[[requirement]]
id = "T23.memory.facts"
statement = "The Memory tab shows only what it read: no DIMM listed says what dmidecode said (on the ryzen, smbios_entry_point: Permission denied), each SPD sensor is named and ordered by its i2c address (0x50), ECC, type and an unread clock say unread instead of Non-ECC, a blank or 0 MHz, mixed ranks are all named, the SPD timings say which part could not be read, and ryzen_smu says it was read at start (scratch/design/t23-monitor-memory-window.md, Memory)."
proof = "built"

[[requirement]]
id = "T23.history.uncapped"
statement = "Every list History, the auto-resume and corecycler status read holds every row, so no count shown as a total is a capped read: 501 runs show 501 and a setup's delete names all 501, 102 sessions show 102 rows, 101 setups 101, and an interrupted session older than the newest 50 still resumes (scratch/design/t23-curve-history.md defect 2)."
proof = "built"

[[requirement]]
id = "T23.window.ccd"
statement = "A core's temperature is its own CCD's reading or none: the core grid and the recorded telemetry sample never take Tctl or CCD 0's reading for a core whose CCD was not read, and the grid and the Monitor head such cores CCD unread, after the read CCDs (scratch/design/t23-monitor-memory-window.md, Window and Monitor)."
proof = "built"

[[requirement]]
id = "T23.curve.zero"
statement = "Set all to 0 names every core its per-core fallback could not set to 0 in a Write failed warning; a fallback that set every core warns nothing (scratch/design/t23-curve-history.md defect 7)."
proof = "built"

[[requirement]]
id = "T22.peaks"
statement = "A core's peak clock or temperature that no tick read is shown as unread in the Results log and stored as nothing in history, never as 0; a core with no clock read still gets its line (scratch/design/t23-config-results.md R7)."
proof = "built"

[[requirement]]
id = "T23.results.summary"
statement = "The Results summary counts the run, not the form or the status cache: Cores is the run's core count, the round shown while it runs is the round under test, and at the end the rounds completed of the run's own total; a stop in round 1 of 3 reads 0/3 (scratch/design/t23-config-results.md R3 to R6, t23-monitor-memory-window.md D5)."
proof = "built"

[[requirement]]
id = "T23.results.fresh"
statement = "A new run starts the Results tab with no summary, rows or log from the last run (scratch/design/t23-config-results.md R8: the last run's summary stayed up until the first update a second later)."
proof = "built"

[[requirement]]
id = "T23.curve.remember"
statement = "Remember current values names the cores it kept and those it could not read; Put remembered values back names the cores it wrote, never every core (scratch/design/t23-curve-history.md defect 6)."
proof = "built"

[[requirement]]
id = "T23.config.threads"
statement = "Threads per core offers up to the CPU's own threads per core: 2 with SMT, 1 without it or without a readable topology, with a hint saying the CPU runs one thread per core (scratch/design/t23-config-results.md C2: the form offered 2 and the run used 1)."
proof = "built"

[[requirement]]
id = "T23.config.cores"
statement = "When the CPU's cores cannot be read, the Configuration tab says so where the cores are chosen instead of asking for a ticked core (scratch/design/t23-config-results.md C3)."
proof = "built"

[[requirement]]
id = "T22.history.unjudged"
statement = "In History, a core with no verdict reads as still running only while its run is running; in a crashed or stopped run it reads no verdict (scratch/design/t23-curve-history.md defect 4)."
proof = "built"

[[requirement]]
id = "T22.history.co"
statement = "History shows a setup's stored CO as none only when none was recorded ({}); a stored value that does not parse as an object reads unreadable, in the setup table and the run detail (scratch/design/t23-curve-history.md defect 5)."
proof = "built"

[[requirement]]
id = "O19.record"
statement = "Every tuner sample records each core's clock, effective clock, C0 and voltage from the PM table arrays measured on table 0x620205 (scratch/design/o19-record.md), a value outside its physical bounds as none and nothing on any other table version; a sample stored before reads back with no cores."
proof = "built"

[[requirement]]
id = "T22.history.off"
statement = "Without a history database the History tab says history is off, never zero runs (scratch/design/t23-curve-history.md defect 3)."
proof = "built"

[[requirement]]
id = "T23.window.toolbar"
statement = "No menu of the window can hide the toolbar holding Start test and Stop test (scratch/design/t23-monitor-memory-window.md D3: its right-click offered Test Control, which hid Stop during a run with no way back)."
proof = "built"

[[requirement]]
id = "T22.monitor.fallbacks"
statement = "The Monitor tab says what was read when a value has no source: Package unreadable (not a guessed cause), Vcore no sensor, EDC unread/limit in the value/limit form of PPT and TDC; short enough that the window still fits a half-screen tile (scratch/design/t23-monitor-memory-window.md D1 and its facts list)."
proof = "built"

[[requirement]]
id = "T23.window.crash"
statement = "A test worker that crashed still reads crashed, with its message, after the worker's finished signal, never Test complete (scratch/design/t23-monitor-memory-window.md D2)."
proof = "built"

[[requirement]]
id = "T23.memory.stop"
statement = "Stop in the Memory tab is never lost: pressed before the stress tool starts, the tool never starts and the run ends Stopped; pressed while it starts, the tool is killed and the run ends Stopped (scratch/design/t23-monitor-memory-window.md D7)."
proof = "built"

[[requirement]]
id = "T22.memory.dimms"
statement = "Each DIMM temperature stays under its own sensor's label: the reader returns one reading per SPD5118 device in device order, an unreadable one as None, and the Memory tab shows it as unread, never shifting a reading to another DIMM (scratch/design/t23-monitor-memory-window.md D4)."
proof = "built"

[[requirement]]
id = "T23.memory.tools"
statement = "Refresh in the Memory tab offers the stress tools found now, keeping the chosen one when it is still there, so the Tool box and the tools line never disagree (scratch/design/t23-monitor-memory-window.md D6)."
proof = "built"

[[requirement]]
id = "T22.curve.banner"
statement = "The Curve-Tuner banner naming loaded values goes once Fill from CPU replaces them with the CPU's, and stays when the fill read nothing (scratch/design/t23-curve-history.md defect 8)."
proof = "built"

[[requirement]]
id = "T23.history.freed"
statement = "History's right-click menus and its export dialog are freed after use, so its controls stay the listed ones however often they are used (scratch/design/t23-curve-history.md defect 9)."
proof = "built"

[[requirement]]
id = "T22.monitor.stale"
statement = "From the first missed read, the Monitor shows the last reading of Tctl, each CCD, Vcore and Package with (stale) in the stale style, each on its own count, and a fresh read restores it; a value never read keeps its placeholder (scratch/design/t23-monitor-memory-window.md, the facts list)."
proof = "built"

[[requirement]]
id = "T22.monitor.charts"
statement = "A Monitor chart's heading shows no value until one is read and again after a missed read, never 0.0; Max Boost keeps the maximum the CPU reports (unread when it reports none), a higher observed clock only widening the chart (scratch/design/t23-monitor-memory-window.md, the facts list)."
proof = "built"

[[requirement]]
id = "T22.monitor.bars"
statement = "A Monitor per-core bar shows its own CCD's temperature or none, never Tctl in its place; a usage or clock not read shows as unread, never 0% or the last tick's value (scratch/design/t23-monitor-memory-window.md, the facts list)."
proof = "built"

[[requirement]]
id = "T23.window.probes"
statement = "The status bar's MSR and SMU line says it was read at start, which is when the readers took their access (scratch/design/t23-monitor-memory-window.md, Window)."
proof = "built"

[[requirement]]
id = "T23.contract.config"
statement = "Every control of the Configuration tab is listed with its reaction (tests/test_config_tab.py CONFIG_CONTROLS) and the tests fail on an unlisted or missing control; each connected control's reaction is observed through its connection and absent with it cut; each control read at Start changes the profile Start sends."
proof = "built"

[[requirement]]
id = "T23.contract.results"
statement = "Every control of the Results tab is listed with its reaction (tests/test_results_tab.py RESULTS_CONTROLS: Qt's corner button, which selects every cell) and the test fails on an unlisted or missing control; the tab has no spin box, combo box or text input."
proof = "built"

[[requirement]]
id = "T23.contract.monitor"
statement = "Every control of the Monitor tab is listed with its reaction (tests/test_monitor_tab.py MONITOR_CONTROLS: the Per-Core View toggle) and the test fails on an unlisted or missing control; the toggle switches the view only through its connection."
proof = "built"

[[requirement]]
id = "T23.contract.memory"
statement = "Every control of the Memory tab is listed with its reaction (tests/test_gui_residual_edges.py MEMORY_CONTROLS and MEMORY_INPUTS) and the test fails on an unlisted or missing control; Refresh, Run and Stop each react only through their connection, and Run starts the chosen tool for the chosen minutes."
proof = "built"

[[requirement]]
id = "T23.contract.curve"
statement = "Every control of the Curve-Tuner tab is listed with its reaction (tests/test_smu_tab_actions.py CURVE_CONTROLS and CURVE_INPUTS) and the test fails on an unlisted or missing control; each button reacts only through its connection."
proof = "built"

[[requirement]]
id = "T23.style"
statement = "The GUI follows the system Qt style; a probe in a child process falls back to Fusion when the system style would crash, saying why in the log and the status bar."
proof = "built"

[[requirement]]
id = "T23.startstop"
statement = "The toolbar's Start and Stop buttons line up: plain words in one font, the same top and height (owner 2026-10-09; his card 2026-10-13 chose plain words over the two glyphs)."
proof = "built"

[[requirement]]
id = "T23.abort_interrupted"
statement = "Abort takes a session whose driver died in a crash to aborted without running a test, from the GUI and the command line (ryzen 2026-10-13: the GUI Abort only reported that no driver runs, the command line has no abort, and the start refusal still said to abort it)."
proof = "built"

[[requirement]]
id = "T23.halfscreen"
statement = "Every tab stays usable at half-screen width (owner 2026-10-13: the Auto-Tuner tab looked compressed in a split window)."
proof = "built"

[[requirement]]
id = "T24.board_temps"
statement = "Every board temperature input is recorded with each test, named by its chip and label, read safely (an unreadable input recorded as unreadable), shown in History, and never called room temperature."
proof = "not built"
task = "T24"

[[requirement]]
id = "T26.mutation_hook"
statement = "A commit that changes source is refused unless a mutation run with no survivor stamped its exact staged tree (the commit-msg hook mutation-stamp)."
proof = "built"

[[requirement]]
id = "EC.G9"
statement = "The GUI memory test passes only on a clean run judged by the engine's own stressapptest and stress-ng findings; a silicon finding fails it; any other finding, an exit or signal it did not ask for (an out-of-memory kill included), an overrun it had to kill and a launch error give no verdict naming what was read; the user's Stop says Stopped (scratch/design/error-capture.md gap 9)."
proof = "built"

[[requirement]]
id = "EC.G1"
statement = "After a tuner test's payload stops, and after a soak, the kernel log is read once more one machine-check poll later (the poll read from check_interval, at most 5 s, plus the 1 s the kernel rounds its timer to; 6 s when unreadable), so a corrected error the poller logs after the test still grades it (scratch/design/error-capture.md gap 1, owner card O18 A)."
proof = "built"

[[requirement]]
id = "EC.G1.scheduler"
statement = "After a core's last phase passes in the stress scheduler, its CPUs are watched one machine-check poll longer (check_interval plus the 1 s timer rounding, at most 6 s) and a record found there fails that core, so a corrected error logged after the test is not read during the next core's test, where it matches no lane (scratch/design/error-capture.md gap 1, the scheduler's half)."
proof = "built"

[[requirement]]
id = "EC.G5"
statement = "A one-core SEARCH test that reports a pass while a kernel record names the tested core fails that value as silicon; the same pass without the record stands (scratch/design/error-capture.md gap 5)."
proof = "built"

[[requirement]]
id = "A2.coverage"
statement = "Every tuner test stores, for every core, the seconds it spent in each 100 MHz by 5 C cell of its own clock and its CCD's temperature while the load ran, each step capped at 1 s, and the seconds unreadable; History's test line shows the tested core's range from that record (scratch/design/coverage-record.md)."
proof = "built"

[[requirement]]
id = "A2.margins"
statement = "corecycler margins SESSION_ID prints, per core and per 100 MHz of its clock, the shallowest offset that failed in the session's single-core search tests and the deepest that passed above it, each with its seconds there, the values that passed at or below the failure, the temperature range, the tests with no verdict and those with no coverage record; a session recorded with any Curve Shaper other than 0 on a CPU that has one is refused, since its offsets are not the whole offset (scratch/design/margin-walk.md)."
proof = "built"

[[requirement]]
id = "EC.real"
statement = "A real clean run of stress-ng 0.22.01 (the tuner's cpu fft verify shape and the memory test's vm verify shape) and of stressapptest 1.0.11, captured 2026-10-14 on the M1 from the repository's pinned nixpkgs, raises no finding in its backend, and the GUI memory test calls each a pass (scratch/design/error-capture.md gaps 4 and 12, the clean half)."
proof = "built"
