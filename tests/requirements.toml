[[requirement]]
id = "D102"
statement = "In a Bisect whose every smaller group passed, any FAIL of the full set's re-test or of its Q6 replay takes Q6 on the whole set (D32), and the set replays until it passes: a FAIL naming owned cores, a lost verdict, a crash unless it is blamed on a core the session does not own, which pauses P(HELD_KNOB) and by itself moves nothing, and a record charged to the values the full set's slot runs at when the slot's own report carries it, when a resume finds a core of the session in test (the boot died, or the driver ended, during the set's slot), or when the CO journal charged it there and that charge was kept, however it is read (a same-boot resume after a Pause or Close, a dead boot, the kernel log while the slot waits), a late record of a passing smaller group included, since it bears the same charge; a charge the tuner substituted, for a record the CO journal cannot place or on a core another program wrote (D87), fails no re-test or replay that has not run: the record backs its own core off (D70), a waiting Q6 replay stays, and a waiting re-test ends the Bisect as a record between slots does (D100); a record a resume judges at stock, after the database fell behind with the cores sent to stock, fails no set however the journal charged it (PLAN Next 103); a named core gets no extra step, its naming kept in the test's record; a record judged with the set's step moves its core once, to the looser of that step and its own back-off, with its fail bound, save the tested core of a Bisect begun in LIVE1, whose record in its own test's verdict is that 1T test's FAIL and gets the one step with no fail bound; a record charged to the values of a replay that already failed moves no core again; no record ends the replay; a full set of one core stays a found core (L09.retest.single) (PLAN Next 96, scratch/design/brief-unplaced-no-replay-failure.md as amended before code: a record the CO journal could not place, read while the Q6 replay waited, loosened the set a second time)"
proof = "built"

[[requirement]]
id = "D116"
statement = "A Bisect resolves every group that failed before it exits: a core found alone backs off one step in place with FB = V when its own slot fails, so it keeps that back-off whatever ends the Bisect later; the queue goes on until every failed group holds a failed leaf, a failed group whose children all passed or a single core, so a Bisect that finds a core while another failed group's halves are still owed goes on for them, and stops there, since what is left can only find more of a failure already found; then the groups of several take Q6 one after another, smaller first and then by the lowest core, each replaying until it passes; the entry stage runs again only after the last replay passes, and that run is no exact replay of any leaf, so it clears none; a Bisect with one failed leaf runs and ends as before (D116, the Next 51 round-2 review: a SOAK crash whose Bisect crashed in both halves completed with the second half at the values it crashed at)"
proof = "built"

[[requirement]]
id = "D116.stored"
statement = "A Bisect stored during its first group's Q6 replay with a second group still owed reads back from the session file unchanged; after a resume the replay runs again and the second group takes its Q6 before the Bisect exits (D116)"
proof = "built"

[[requirement]]
id = "D116.stored.read"
statement = "A stored Bisect reads back exactly or its session is refused naming the field: an entry no Bisect begins in, a lane that is no owned core, a universe that is not one or more owned cores ascending, values that are not an integer below 0 for each universe core in order, a group of the queue, the results, the parents or the rerun that is not universe cores ascending, a verdict that is not true or false, a group recorded twice, a parents child not inside its parent or neither recorded nor queued, no rerun with an empty queue, or a rerun that is none of the failed leaves the Bisect resolves; a bool is no core and no verdict; every Bisect a build wrote reads, the empty group, the full set's re-test, every Q6 replay a run stores, the full set's own included, a lane outside the universe, a one-core universe at -1 and each of the six entries among them (D116; PLAN Next 99)"
proof = "built"

[[requirement]]
id = "D116.explorer"
statement = "The explorer starts a three-core CPU, halved into a pair and a single core, at its SOAK watch with three unnamed failures to spend, so a future fails the watch, then the pair, then the single core in one Bisect: every future comes to rest and none completes at or past a vector a failed group ran at (D116; PLAN Next 77)"
proof = "built"

[[requirement]]
id = "D118"
statement = "A session never completes at or past a remembered failed vector on every core that vector moved unless its one-off was cleared: at FINALIZE, before the dirty check, the first uncleared remembered vector in stored order that the held values are at or past loosens each core it moved one fine step with no fail bound, the cores having failed together (D102), again until none bars; the session then names the vectors and the new values and runs its pass from LIVE1, so one pass proves them, and a validation completes at the loosened values. This holds after each early exit of a Bisect that leaves a failed group unresolved: a crash in a one-core slot, a record of a core in its own slot, between slots or in a Q6 replay, and a record while the full-set re-test waits (D118 and D116 amended 2026-10-28, tuning-loops-round2.md; GitHub issue 20; PLAN Next 85)"
proof = "built"

[[requirement]]
id = "D118.cleared"
statement = "A remembered vector is cleared by the first clean all-core pass (PASS, no machine check, not skipped) at that vector after its first failure, when that failure came from a test outside a Bisect and the session has remembered no failure since: a stage test re-run at it, the full-set re-test of the Bisect it began and a validation's replay at it all clear it. A Bisect slot's failure is never cleared, so a stage test at a failed slot's vector after a conviction clears nothing (D116); a LIVE1 test or a LIVE1-begun slot at the vector clears nothing, and a continue or a re-engage between the failure and the pass leaves it uncleared. A close and resume keep the mark and the failure still to be cleared, and a validation and a continue keep the marks (D118 and D95; PLAN Next 85, review round 1)"
proof = "built"

[[requirement]]
id = "D118.again"
statement = "A later failure at a remembered vector ends its one-off exemption for good: a cleared mark goes, and no later re-test clears the vector again, a re-test that first named a core the session does not own included (D118: the one-off of the 2026-10-20 card is a single unnamed failure; PLAN Next 85)"
proof = "built"

[[requirement]]
id = "D118.live1"
statement = "A LIVE1-begun Bisect remembers the vector of each slot that fails, from a one-core load's silicon report, a dead boot the flow judges and a lost verdict, so TIGHTEN and FINALIZE see it; a LIVE1 test outside a Bisect, a conviction and an incident remember nothing (D118 and D116 amended 2026-10-28; PLAN Next 85)"
proof = "built"

[[requirement]]
id = "D118.abort"
statement = "An Abort of a validation whose values an uncleared remembered failure bars, on every core it moved, ends aborted with every owned core at its baseline, sending no value back, as one owing a replay does: a failure that repeated at those values (D118.again), a failed Bisect slot's vector, or a failure stored by a build that kept no mark. A validation whose single failure at its values an exact replay passed clean is restored completed with its values, as is one at values no remembered failure bars (D118 and D95; PLAN Next 85, review round 1)"
proof = "built"

[[requirement]]
id = "D118.stored"
statement = "The stored session keeps the cleared vectors and the one failure a re-test may still clear; a session stored before the record existed reads as none cleared and none clearable. A core is an integer in every stored vector, never 0.0 or true. A failed list naming a vector twice refuses the session naming failed_vectors, a cleared list that is not a list of owned vectors, holds a vector twice or names one not remembered refuses it naming cleared_vectors, and a clearable vector that is malformed, not remembered or already cleared refuses it naming clearable_vector (D118; PLAN Next 85)"
proof = "built"

[[requirement]]
id = "D118.explorer"
statement = "The explorer starts the three-core D116 CPU at its SOAK watch and at its first LIVE1 test with three dead boots to spend: every future comes to rest and none completes at or past a vector a failed group ran at, LIVE1-begun slots included (D118; PLAN Next 85)"
proof = "built"

