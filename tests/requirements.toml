[[requirement]]
id = "EC.G9"
statement = "The GUI memory test passes only on a clean run judged by the engine's own stressapptest and stress-ng findings; a silicon finding fails it; any other finding, an exit or signal it did not ask for (an out-of-memory kill included), an overrun it had to kill and a launch error give no verdict naming what was read; the user's Stop says Stopped (scratch/design/error-capture.md gap 9)."
proof = "built"

[[requirement]]
id = "EC.G1"
statement = "After a tuner test's payload stops, and after a soak, the kernel log is read once more one machine-check poll later (the poll read from check_interval, at most 5 s, plus the 1 s the kernel rounds its timer to; 6 s when unreadable), so a corrected error the poller logs after the test still grades it (scratch/design/error-capture.md gap 1, owner card O18 A)."
proof = "built"

[[requirement]]
id = "EC.G1.scheduler"
statement = "After a core's last phase passes in the stress scheduler, its CPUs are watched one machine-check poll longer (check_interval plus the 1 s timer rounding, at most 6 s) and a record found there fails that core, so a corrected error logged after the test is not read during the next core's test, where it matches no lane (scratch/design/error-capture.md gap 1, the scheduler's half)."
proof = "built"

[[requirement]]
id = "EC.G5"
statement = "A one-core SEARCH test that reports a pass while a kernel record names the tested core fails that value as silicon; the same pass without the record stands (scratch/design/error-capture.md gap 5)."
proof = "built"

[[requirement]]
id = "A2.coverage"
statement = "Every tuner test stores, for every core, the seconds it spent in each 100 MHz by 5 C cell of its own clock and its CCD's temperature while the load ran, each step capped at 1 s, and the seconds unreadable; History's test line shows the tested core's range from that record (scratch/design/coverage-record.md)."
proof = "built"

[[requirement]]
id = "A2.margins"
statement = "corecycler margins SESSION_ID prints, per core and per 100 MHz of its clock, the shallowest offset that failed in the session's single-core search tests and the deepest that passed above it, each with its seconds there, the values that passed at or below the failure, the temperature range, the tests with no verdict and those with no coverage record; a test is read stricter than the machine grades it, never as its load alone reported: a record on the tested core fails it whatever the load said, where the machine fails only a pass, and a corrected machine check no core is blamed for in an environment verdict fails it at its first occurrence, where the machine fails it only once it recurs at that core and value with no other core showing one (PLAN Next 102 stores the machine's own grade so the two agree); a session recorded with any Curve Shaper other than 0 on a CPU that has one is refused, since its offsets are not the whole offset, and a test whose evidence_json is in no shape a build of this tool writes is refused naming the test and the field (scratch/design/margin-walk.md; scratch/design/split-slice.md, Review round 1, rule 1)."
proof = "built"

[[requirement]]
id = "EC.real"
statement = "A real clean run of stress-ng 0.22.01 (the tuner's cpu fft verify shape and the memory test's vm verify shape) and of stressapptest 1.0.11, captured 2026-10-14 on an aarch64 machine from the repository's pinned nixpkgs, raises no finding in its backend, and the GUI memory test calls each a pass (scratch/design/error-capture.md gaps 4 and 12, the clean half)."
proof = "built"

