[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "corecycler"
version = "0.0.1"
description = "Per-core CPU stability tester and PBO Curve Optimizer tuner for AMD Ryzen on Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Daaboulex" }]
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
corecycler = "main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["main", "cli", "notify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that take >5s (deselect with -m 'not slow')",
    "hardware: tests that verify hardware-specific detection behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "TID251"]

# Regression-lock for the split-database bug class: under sudo these resolve
# to /root, silently forking app state. config.paths is the one allowed user.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pathlib.Path.home".msg = "Path.home() is /root under sudo (split-database bug) — use config.paths.user_home()"
"os.path.expanduser".msg = "expanduser('~') is /root under sudo — use config.paths.user_home()"

[tool.ruff.lint.per-file-ignores]
"src/config/paths.py" = ["TID251"]
