# Canonical Maintenance workflow — Nix Packaging Standard.
# Source of truth: github:Daaboulex/nix-packaging-standard. Synced into each
# packaging repo by sync.sh; byte-identity enforced by the `std-conformance`
# flake check. flake.lock refresh: evaluate every declared system, build the
# checks on a runner for each declared system, push only if every one is
# green, else open a labeled issue that closes itself on the next clean run;
# plus stale-branch cleanup. Temporary fixes are probed and healed between the
# update and the verification. Cadence is per-repo via the MAINTENANCE_CADENCE
# repo variable (daily | biweekly | weekly); unset = weekly.
name: Maintenance
on:
  schedule:
    - cron: '0 4 * * *' # Daily 4 AM UTC; the gate job applies the per-repo cadence
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  # Per-repo cadence gate. Set the MAINTENANCE_CADENCE repo variable to
  # `daily` or `biweekly` (Wed+Sun) for fast-moving / closure-heavy repos;
  # unset or any other value means `weekly` (Sun) — identical to the old
  # Sunday-only schedule. workflow_dispatch always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          CADENCE: ${{ vars.MAINTENANCE_CADENCE || 'weekly' }}
          EVENT: ${{ github.event_name }}
        run: |
          dow=$(date -u +%u) # 1=Mon .. 7=Sun
          run=no
          case "$CADENCE" in
          daily) run=yes ;;
          biweekly) if [ "$dow" = 3 ] || [ "$dow" = 7 ]; then run=yes; fi ;;
          *) if [ "$dow" = 7 ]; then run=yes; fi ;; # weekly (default)
          esac
          if [ "$EVENT" = workflow_dispatch ]; then run=yes; fi
          echo "cadence=$CADENCE dow=$dow event=$EVENT -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  prepare:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      runners: ${{ steps.candidate.outputs.runners }}
      healed: ${{ steps.heal.outputs.healed }}
      kept: ${{ steps.heal.outputs.kept }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: lazy-trees = false

      - name: Update flake.lock
        run: nix flake update

      # Probe the temporary fixes against the UPDATED inputs, before the
      # verification build. Probing the committed lock instead would read a fix
      # needed only on the NEW nixpkgs as healed, drop it, and re-break on the
      # next bump. Removals ride the SAME verification as the lock bump, so the
      # two land together or neither does.
      - name: Probe and heal temporary fixes
        id: heal
        run: bash scripts/heal-overlays.sh

      - name: Evaluate every declared system
        run: |
          set -o pipefail
          nix flake check --no-build --all-systems 2>&1 | tee /tmp/lock-build.log

      - name: Record the candidate
        id: candidate
        run: |
          sha=$(git rev-parse HEAD)
          runners=$(bash scripts/declared-runners.sh)
          git add flake.lock
          git diff --cached --binary > /tmp/candidate.patch
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: /tmp/candidate.patch
          if-no-files-found: error

      - name: Keep the evaluation log for the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-evaluation
          path: /tmp/lock-build.log

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: lazy-trees = false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: /tmp/candidate

      - name: Apply the candidate
        run: |
          if [ -s /tmp/candidate/candidate.patch ]; then
            git apply --index /tmp/candidate/candidate.patch
          fi

      - name: Build every check for this system
        run: |
          SYS=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          build() {
            nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$SYS" 2>&1 | tee /tmp/lock-build.log
            return "${PIPESTATUS[0]}" # nix-fast-build's real exit, NOT tee's (always 0).
          }
          set +e
          build
          code=$?
          # Escalating retry on a transient external-fetch failure (crates.io
          # rate-limit, registry/CDN blip) so maintenance doesn't open a spurious
          # "broke build" issue for an infra hiccup, and so an outage lasting
          # minutes heals inside this run rather than waiting for tomorrow's.
          transient='crates\.io|error: cannot download|unable to download|http error 5[0-9][0-9]|status code: (403|429|5[0-9][0-9])|curl: \(|couldn.t resolve host|connection reset by peer|temporary failure in name resolution|operation timed out'
          for backoff in 60 300 900; do
            [ "$code" -eq 0 ] && break
            grep -qiE "$transient" /tmp/lock-build.log || break
            echo "::warning::Transient external-fetch failure during maintenance build; retrying in ${backoff}s."
            sleep "$backoff"
            build
            code=$?
          done
          exit "$code"

      - name: Keep the build log for the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-${{ matrix.os }}
          path: /tmp/lock-build.log

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: /tmp/candidate

      - name: Push the verified lock
        env:
          HEALED: ${{ needs.prepare.outputs.healed }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -s /tmp/candidate/candidate.patch ]; then
            echo "Nothing to push: lock unchanged and no fix healed"
            exit 0
          fi
          git apply --index /tmp/candidate/candidate.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$HEALED" ]; then
            git commit -m "chore: update flake.lock; drop healed fix(es): ${HEALED}"
          else
            git commit -m "chore: update flake.lock"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      # Nothing else ever closed these, so a maintenance failure that got fixed
      # stayed open forever and kept fleet-audit red (update.yml has always
      # closed its own on success; this is the same contract).
      - name: Close prior failure reports on success
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        with:
          script: |
            const titleBase = 'Maintenance: flake.lock update broke build';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'maintenance', state: 'open'
            });
            for (const issue of open.data) {
              if (!issue.title.startsWith(titleBase)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved: the scheduled lock refresh built clean in [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed'
              });
            }

  report:
    needs: [prepare, verify]
    if: always() && (needs.prepare.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: log-*
          path: /tmp/logs

      - name: Gather the failure logs
        run: |
          : > /tmp/lock-build.log
          found=0
          for f in /tmp/logs/*/lock-build.log; do
            [ -f "$f" ] || continue
            found=1
            printf '=== %s\n' "$(basename "$(dirname "$f")")" >> /tmp/lock-build.log
            cat "$f" >> /tmp/lock-build.log
          done
          if [ "$found" = 0 ]; then
            echo "No job uploaded a log: the run failed before the evaluation or the build started." >> /tmp/lock-build.log
          fi

      - name: Classify failure
        id: classify
        run: bash scripts/classify-build-failure.sh /tmp/lock-build.log

      - name: Issue the failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        env:
          FAIL_CLASS: ${{ steps.classify.outputs.class }}
          FAIL_ATTRS: ${{ steps.classify.outputs.failed_attrs }}
          FAIL_DRVS: ${{ steps.classify.outputs.failed_drvs }}
          HEALED: ${{ needs.prepare.outputs.healed }}
          KEPT: ${{ needs.prepare.outputs.kept }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/lock-build.log', 'utf8');
            const lastLines = log.split('\n').slice(-80).join('\n');
            const plain = log.replace(/\x1b\[[0-9;]*m/g, '').split('\n');
            const at = plain.findIndex(l => /^(\S+> )?\s*error(\[E\d+\])?:/.test(l));
            const firstError = at < 0 ? [] : [
              '<details open><summary>First error</summary>',
              '',
              '```',
              ...plain.slice(at, at + 25),
              '```',
              '</details>',
              ''
            ];
            const titleBase = 'Maintenance: flake.lock update broke build';
            const title = `${titleBase} (${process.env.FAIL_CLASS})`;

            // Close any prior open report of the same failure before filing a
            // fresh one, so a recurring lock-build break does not pile up
            // duplicate issues (mirrors update.yml's update-failed dedup).
            // Prefix match: the class suffix varies between rounds.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'maintenance', state: 'open'
            });
            for (const issue of existing.data) {
              if (!issue.title.startsWith(titleBase)) continue;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
                state_reason: 'not_planned'
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['maintenance'],
              body: [
                '## flake.lock update failed to build',
                '',
                'The scheduled `nix flake update` produced a flake.lock that does not evaluate or build on every declared system.',
                '**flake.lock was NOT pushed.**',
                '',
                `**Class**: \`${process.env.FAIL_CLASS}\``,
                `**Failed attributes**: ${process.env.FAIL_ATTRS || '(none reported)'}`,
                `**Failed derivations**: ${process.env.FAIL_DRVS || '(none parsed)'}`,
                `**Temporary fixes kept**: ${process.env.KEPT || '(none)'}`,
                ...(process.env.HEALED ? [
                  `**Healed fixes NOT pushed**: \`${process.env.HEALED}\` — they probed as no`,
                  'longer needed against the new inputs, but the verification was red, so the',
                  'removal was not pushed. If the removal is what broke it, correct that',
                  "fix's predicate; otherwise the failure is the lock bump itself.",
                ] : []),
                '',
                'Builds run with --keep-going, so the list above is the COMPLETE',
                'failure set for this lock -- fix them together, not one per round.',
                '',
                ...firstError,
                '<details><summary>Build log (last 80 lines)</summary>',
                '',
                '```',
                lastLines,
                '```',
                '</details>',
                '',
                '### Recovery',
                '```bash',
                'nix flake update',
                'nix flake check --no-build --all-systems',
                'nix build --no-link  # investigate failure',
                '```',
                '',
                '---',
                '*Created by [maintenance workflow](.github/workflows/maintenance.yml)*'
              ].join('\n')
            });

  cleanup:
    needs: gate
    if: needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cleanup stale branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        with:
          script: |
            // Delete stale maintenance branches older than 30 days.
            // Matches update/* and upstream-update/* (both _ and / separators).
            const { data: allRefs } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: 'heads/'
            });
            const stalePatterns = [
              /^refs\/heads\/update[\/_]/,
              /^refs\/heads\/upstream-update[\/_]/,
            ];
            const candidates = allRefs.filter(r => stalePatterns.some(p => p.test(r.ref)));
            const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
            for (const ref of candidates) {
              try {
                const { data: commit } = await github.rest.git.getCommit({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: ref.object.sha
                });
                if (new Date(commit.author.date).getTime() < thirtyDaysAgo) {
                  console.log(`Deleting stale branch: ${ref.ref}`);
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner, repo: context.repo.repo,
                    ref: ref.ref.replace('refs/', '')
                  });
                }
              } catch (e) {
                console.log(`Skip ${ref.ref}: ${e.message}`);
              }
            }
