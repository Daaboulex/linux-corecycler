# Canonical Update workflow — Nix Packaging Standard.
# Source of truth: github:Daaboulex/nix-packaging-standard. Bootstrapped into
# each packaging repo by sync.sh; byte-identity enforced by the std-conformance
# flake check (flakeModules.base) — do not edit per-repo copies.
name: Update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.update.outputs.exit_code }}
      updated: ${{ steps.update.outputs.updated }}
      old_version: ${{ steps.update.outputs.old_version }}
      new_version: ${{ steps.update.outputs.new_version }}
      package_name: ${{ steps.update.outputs.package_name }}
      auto_added: ${{ steps.update.outputs.auto_added }}
      upstream_url: ${{ steps.update.outputs.upstream_url }}
      error_type: ${{ steps.update.outputs.error_type }}
      stalled: ${{ steps.streak.outputs.stalled }}
      sha: ${{ steps.candidate.outputs.sha }}
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: lazy-trees = false

      # The verification runs built binaries (verify.binary, a custom smoke
      # test), and a buildFHSEnv wrapper starts bwrap in an unprivileged user
      # namespace. Ubuntu 24.04's AppArmor denies that by default, and 26.04
      # adds a second knob; each is opened only where it exists, and the
      # postcondition is proven so a runner that still refuses fails here,
      # named, and not as a smoke-test verdict on the package.
      - name: Allow unprivileged user namespaces
        run: |
          for knob in kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined; do
            f="/proc/sys/${knob//.//}"
            [ -e "$f" ] || continue
            sudo sysctl -w "$knob=0"
          done
          unshare --user --map-root-user true || {
            echo "::error::this runner refuses an unprivileged user namespace, so nothing wrapped in bwrap can be verified here"
            exit 1
          }

      - name: Run update
        id: update
        run: |
          set +e
          run_update() {
            bash scripts/update.sh 2>&1 | tee /tmp/update.log
            return "${PIPESTATUS[0]}" # update.sh's exit, NOT tee's (always 0)
          }
          transient_fetch_failure='crates\.io|error: cannot download|unable to download|http error 5[0-9][0-9]|status code: (403|429|5[0-9][0-9])|curl: \(|couldn.t resolve host|connection reset by peer|temporary failure in name resolution|operation timed out'
          run_update
          EXIT_CODE=$?
          for backoff in 60 300 900; do
            [ "$EXIT_CODE" -eq 0 ] && break
            grep -qiE "$transient_fetch_failure" /tmp/update.log || break
            echo "::warning::Transient external-fetch failure during update; retrying in ${backoff}s."
            sleep "$backoff"
            run_update
            EXIT_CODE=$?
          done
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/update-outputs.env ]; then
            cat /tmp/update-outputs.env >> "$GITHUB_OUTPUT"
          fi

      # Exit 2 means "transient, retry next run", and a permanent failure
      # reported that way keeps the run green forever (eden-nix#13: a 404 for
      # two months). The Actions cache carries the count of consecutive exit-2
      # runs across runs; a week of them is escalated below as `stalled`.
      - name: Restore the transient-exit streak
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/update-streak
          key: update-streak-${{ github.run_id }}
          restore-keys: update-streak-
      - name: Count consecutive transient exits
        id: streak
        env:
          EXIT_CODE: ${{ steps.update.outputs.exit_code }}
        run: |
          n=0
          if [ -f /tmp/update-streak ] && [[ "$(cat /tmp/update-streak)" =~ ^[0-9]+$ ]]; then
            n=$(cat /tmp/update-streak)
          fi
          if [ "$EXIT_CODE" = "2" ]; then n=$((n + 1)); else n=0; fi
          echo "$n" > /tmp/update-streak
          echo "streak=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 7 ]; then
            echo "::error::update.sh has exited 2 (transient, retry next run) on ${n} consecutive runs; a permanent failure is hiding behind the transient exit"
            echo "stalled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the transient-exit streak
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/update-streak
          key: update-streak-${{ github.run_id }}

      - name: Record the candidate
        id: candidate
        if: steps.update.outputs.updated == 'true' || steps.update.outputs.exit_code == '1'
        run: |
          sha=$(git rev-parse HEAD)
          git add -A ':!AI-*.json'
          git diff --cached --binary > /tmp/candidate.patch
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Name a runner for every other declared system
        id: runners
        if: steps.update.outputs.updated == 'true' && steps.update.outputs.exit_code == '0'
        run: |
          built=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          runners=$(bash scripts/declared-runners.sh "$built")
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
      - if: steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: /tmp/candidate.patch
          if-no-files-found: error
      - name: Keep the update log for the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-update
          path: /tmp/update.log

  verify:
    needs: update
    if: needs.update.outputs.runners != '' && needs.update.outputs.runners != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.update.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.sha }}
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
        with:
          extra-conf: lazy-trees = false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: /tmp/candidate

      - name: Apply the candidate
        run: git apply --index /tmp/candidate/candidate.patch

      - name: Build every check for this system
        run: |
          SYS=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          build() {
            nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$SYS" 2>&1 | tee /tmp/update.log
            return "${PIPESTATUS[0]}"
          }
          set +e
          build
          code=$?
          transient='crates\.io|error: cannot download|unable to download|http error 5[0-9][0-9]|status code: (403|429|5[0-9][0-9])|curl: \(|couldn.t resolve host|connection reset by peer|temporary failure in name resolution|operation timed out'
          for backoff in 60 300 900; do
            [ "$code" -eq 0 ] && break
            grep -qiE "$transient" /tmp/update.log || break
            echo "::warning::Transient external-fetch failure during the update build; retrying in ${backoff}s."
            sleep "$backoff"
            build
            code=$?
          done
          exit "$code"

      - name: Keep the build log for the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-${{ matrix.os }}
          path: /tmp/update.log

  publish:
    needs: [update, verify]
    if: >-
      always()
      && needs.update.result == 'success'
      && needs.update.outputs.exit_code == '0'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.sha }}
      - if: needs.update.outputs.updated == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: /tmp/candidate

      # Silent success: commit + push
      - name: Push update
        if: needs.update.outputs.updated == 'true'
        # Outputs pass via env, never interpolated into the run-block shell
        # (an upstream tag with a quote or $(...) would otherwise inject).
        env:
          OLDV: ${{ needs.update.outputs.old_version }}
          NEWV: ${{ needs.update.outputs.new_version }}
          PKG: ${{ needs.update.outputs.package_name }}
          AUTO_ADDED: ${{ needs.update.outputs.auto_added }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git apply --index /tmp/candidate/candidate.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          if [ -n "${AUTO_ADDED}" ]; then
            git commit -m "chore: update ${PKG} ${OLDV} -> ${NEWV}" \
              -m "New upstream python requirement(s) added to the env: ${AUTO_ADDED}."
          else
            git commit -m "chore: update ${PKG} ${OLDV} -> ${NEWV}"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      # Auto-close previous failure issues on success. Keyed on exit_code alone:
      # gating on `updated` too left a repo whose update was FIXED but whose
      # upstream had not moved unable to ever clear its own ticket.
      - name: Close resolved issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        # Pass outputs via env, never interpolate ${{ }} into the script body
        # (a value containing a quote/newline would break out of the JS).
        env:
          NEW_VERSION: ${{ needs.update.outputs.new_version }}
          DID_UPDATE: ${{ needs.update.outputs.updated }}
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'update-failed', state: 'open'
            });
            const body = process.env.DID_UPDATE === 'true'
              ? `Resolved by auto-update to ${process.env.NEW_VERSION}.`
              : 'Resolved: the update path now completes cleanly (upstream version unchanged).';
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            }

  # Diagnostic issue on failure. Keyed on exit_code==1 alone (not on
  # `updated`) so config/version-read failures — which never reach the
  # point of setting `updated` — still surface. A single exit 2 is
  # transient and files nothing; a week-long streak of them is `stalled`.
  # An update that built here but fails on another declared system is a
  # build-error too, and nothing of it is pushed.
  report:
    needs: [update, verify]
    if: >-
      always()
      && needs.update.result == 'success'
      && (needs.update.outputs.exit_code == '1'
          || needs.update.outputs.stalled == 'true'
          || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.sha }}
      - if: needs.update.outputs.sha != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: /tmp/candidate
      - name: Apply the attempted update
        if: needs.update.outputs.sha != ''
        run: |
          if [ -s /tmp/candidate/candidate.patch ]; then
            git apply --index /tmp/candidate/candidate.patch
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: log-*
          path: /tmp/logs

      - name: Gather the failure logs
        run: |
          : > /tmp/update.log
          found=0
          for f in /tmp/logs/log-update/update.log /tmp/logs/log-ubuntu-*/update.log; do
            [ -f "$f" ] || continue
            found=1
            printf '=== %s\n' "$(basename "$(dirname "$f")")" >> /tmp/update.log
            cat "$f" >> /tmp/update.log
          done
          if [ "$found" = 0 ]; then
            echo "No job uploaded a log: the run failed before the update started." >> /tmp/update.log
          fi

      # The updater's own log already holds the builder output; name the class
      # from it so the issue title says what broke, not merely that something
      # did. maintenance.yml has done this since the classifier existed.
      - name: Classify the failure
        id: classify
        run: bash scripts/classify-build-failure.sh /tmp/update.log

      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        # Pass outputs via env, never interpolate ${{ }} into the script body
        # (a value containing a quote/newline would break out of the JS).
        env:
          ERROR_TYPE: ${{ (needs.verify.result == 'failure' && 'build-error') || needs.update.outputs.error_type || (needs.update.outputs.stalled == 'true' && 'stalled') || '' }}
          OTHER_SYSTEM_FAILED: ${{ needs.verify.result == 'failure' }}
          OLD_VERSION: ${{ needs.update.outputs.old_version }}
          NEW_VERSION: ${{ needs.update.outputs.new_version }}
          UPSTREAM_URL: ${{ needs.update.outputs.upstream_url }}
          PKG: ${{ needs.update.outputs.package_name }}
          FAIL_CLASS: ${{ steps.classify.outputs.class }}
          FAILED_ATTRS: ${{ steps.classify.outputs.failed_attrs }}
          FAILED_DRVS: ${{ steps.classify.outputs.failed_drvs }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/update.log', 'utf8');
            const lastLines = log.split('\n').slice(-100).join('\n');
            const plain = log.replace(/\x1b\[[0-9;]*m/g, '').split('\n');
            const at = plain.findIndex(l => /^(\S+> )?\s*error(\[E\d+\])?:/.test(l));
            const firstError = at < 0 ? [] : [
              '<details open><summary>First error</summary>',
              '',
              '```',
              ...plain.slice(at, at + 25),
              '```',
              '</details>',
              ''
            ];
            const errorType = process.env.ERROR_TYPE || 'unknown';
            const oldV = process.env.OLD_VERSION || '?';
            const newV = process.env.NEW_VERSION || '?';
            const upstream = process.env.UPSTREAM_URL || '';
            const pkg = process.env.PKG || context.repo.repo;
            const failClass = process.env.FAIL_CLASS || '';
            const failedAttrs = process.env.FAILED_ATTRS || '';
            const failedDrvs = process.env.FAILED_DRVS || '';
            const titleClass = (failClass && failClass !== 'unclassified') ? failClass : errorType;
            const otherSystem = process.env.OTHER_SYSTEM_FAILED === 'true' ? [
              'The update built on the update runner but failed on another declared',
              'system; each log section below names the runner it came from.',
              ''
            ] : [];
            const failureBlock = (failedAttrs || failedDrvs) ? [
              '### Failing targets, the complete set',
              '',
              '```',
              [failedAttrs, failedDrvs].filter(Boolean).join('\n'),
              '```',
              ''
            ] : [];

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'update-failed', state: 'open'
            });
            for (const issue of existing.data) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
                state_reason: 'not_planned'
              });
            }

            // execFileSync passes args straight to git — no shell, so a
            // pkg/version value with shell metacharacters cannot inject.
            const { execFileSync } = require('child_process');
            const git = (...args) => execFileSync('git', args, { stdio: 'inherit' });
            const branch = `update/${pkg}-${newV}`;
            let branchPushed = false;
            // remirror-needed (trackOnly) makes no file changes, and a stalled
            // streak has no attempt to recover — skip the empty update branch;
            // the issue itself is the notification.
            if (errorType !== 'remirror-needed' && errorType !== 'stalled') {
              try {
                git('config', 'user.name', 'github-actions[bot]');
                git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
                git('checkout', '-B', branch);
                git('add', '-A', ':!AI-*.json');
                git('commit', '-m', `wip: attempted update ${oldV} -> ${newV}`, '--allow-empty');
                git('push', '-f', 'origin', branch);
                branchPushed = true;
              } catch (e) { /* best-effort */ }
            }

            const recoveryBlock = branchPushed ? [
              '### Recovery',
              '```bash',
              `git fetch && git checkout update/${pkg}-${newV}`,
              '# Fix the issue, then:',
              'nix flake check --no-eval-cache && nix build --no-link',
              `git checkout main && git merge update/${pkg}-${newV}`,
              '```'
            ] : [];

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Update ${pkg} ${oldV} -> ${newV}: ${titleClass}`,
              labels: ['update-failed'],
              body: [
                `## Update Failed: ${pkg} ${oldV} -> ${newV}`,
                '',
                `**Failure**: \`${errorType}\``,
                upstream ? `**Upstream**: ${upstream}` : '',
                '',
                ...otherSystem,
                ...failureBlock,
                ...firstError,
                '### Build log (last 100 lines)',
                '<details><summary>Click to expand</summary>',
                '',
                '```',
                lastLines,
                '```',
                '</details>',
                '',
                ...recoveryBlock,
                '',
                '---',
                '*Created by [update workflow](.github/workflows/update.yml)*'
              ].filter(Boolean).join('\n')
            });

  retire:
    needs: [update, verify, publish, report]
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Exit 2 is a transient network failure: it resolves no issue, so it retires no branch.
      # Only the default branch retires: a run dispatched on an update/* branch is WORKING on
      # that branch, and this job would delete the ref that same run just pushed to.
      - name: Retire attempt branches that no longer have an open issue
        if: >-
          github.ref_name == github.event.repository.default_branch
          && (needs.update.outputs.exit_code == '0' || needs.update.outputs.exit_code == '1')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        env:
          PKG: ${{ needs.update.outputs.package_name }}
          KEEP: ${{ (needs.update.outputs.exit_code == '1' || needs.verify.result == 'failure') && needs.update.outputs.new_version || '' }}
        with:
          script: |
            const pkg = process.env.PKG;
            if (!pkg) {
              core.info('no package_name reported; leaving every branch alone');
              return;
            }
            const keep = process.env.KEEP
              ? `refs/heads/update/${pkg}-${process.env.KEEP}`
              : '';
            let refs = [];
            try {
              const res = await github.rest.git.listMatchingRefs({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `heads/update/${pkg}-`
              });
              refs = res.data;
            } catch (e) {
              core.info(`could not list attempt branches: ${e.message}`);
              return;
            }
            for (const r of refs) {
              if (r.ref === keep) continue;
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: r.ref.replace('refs/', '')
                });
                core.info(`retired ${r.ref}`);
              } catch (e) {
                core.info(`could not retire ${r.ref}: ${e.message}`);
              }
            }
