name: Update
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    uses: Daaboulex/nix-packaging-standard/.github/workflows/package-update.yml@release
    with:
      cadence: ${{ vars.UPDATE_CADENCE || 'daily' }}
